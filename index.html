<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ec">
<title>Manu & Anisha · Wedding Invitation</title>
<meta name="description" content="Manu & Anisha · Sunday, 6 December 2026 · Krishnasree Kalyana Mandapam, Para">
<meta property="og:title" content="Manu & Anisha · Wedding Invitation">
<meta property="og:description" content="Sunday, 6 December 2026 · 10:30 – 11:30 AM · Krishnasree Kalyana Mandapam, Para">
<meta property="og:image" content="https://manu-anisha.netlify.app/couple.webp">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&family=Jost:wght@300;400;500&family=Manjari:wght@400;700&family=Chilanka&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#fbf6ec;
    --paper:#fffdf8;
    --maroon:#8e1b2c;
    --gold:#b8893b;
    --gold-soft:#d9bd84;
    --lotus:#e48aa8;
    --ink:#3b2a24;
    --muted:#7a6558;
    --line:rgba(184,137,59,.3);
    --serif:"Cormorant Garamond", Georgia, serif;
    --script:"Pinyon Script", "Cormorant Garamond", serif;
    --sans:"Jost", system-ui, sans-serif;
    --ml:"Manjari", "Noto Sans Malayalam", sans-serif;
    --ml-script:"Chilanka", "Manjari", sans-serif;
    --gutter:clamp(18px, 5vw, 40px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    font-family:var(--serif);
    color:var(--ink);
    background:
      radial-gradient(120% 60% at 50% 0%, #fff8ea 0%, transparent 60%),
      radial-gradient(90% 50% at 50% 100%, #f8e6cb 0%, transparent 70%),
      var(--ivory);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body.locked{overflow:hidden;height:100svh}
  body.ml{font-family:var(--ml)}
  img,svg{max-width:100%}

  /* ---------- language toggle ---------- */
  .lang{
    position:fixed;top:max(14px, env(safe-area-inset-top));right:14px;z-index:60;
    display:flex;padding:3px;border-radius:999px;
    background:rgba(255,253,248,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--line);box-shadow:0 4px 18px rgba(142,27,44,.08);
  }
  .lang button{
    border:0;background:transparent;cursor:pointer;
    padding:8px 14px;border-radius:999px;min-width:44px;
    font:500 13px/1 var(--sans);letter-spacing:.06em;color:var(--muted);
    transition:background .25s,color .25s;
  }
  .lang button[data-set="ml"]{font-family:var(--ml);font-weight:700;letter-spacing:0;font-size:14px}
  .lang button[aria-pressed="true"]{background:var(--maroon);color:#fff}

  /* ---------- shared type ---------- */
  .kicker{font:400 11px/1.6 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
  body.ml .kicker{font:700 14px/1.4 var(--ml);letter-spacing:.04em;text-transform:none}
  .names{
    display:flex;align-items:center;justify-content:center;gap:.3em;flex-wrap:wrap;
    font-family:var(--script);color:var(--maroon);font-size:clamp(42px, 12vw, 68px);line-height:1.05;font-weight:400;
  }
  body.ml .names{font-family:var(--ml);font-weight:700;font-size:clamp(32px, 9vw, 46px)}
  .names .amp{font-family:var(--serif);font-style:italic;font-size:.45em;color:var(--gold)}
  .date-line{font:400 12.5px/1.6 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
  body.ml .date-line{font:400 16px/1.6 var(--ml);letter-spacing:.02em;text-transform:none}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;
    min-height:46px;padding:12px 22px;border-radius:999px;border:1px solid var(--maroon);
    font:500 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;
    color:var(--maroon);background:transparent;transition:background .25s,color .25s,transform .2s;
  }
  body.ml .btn{font:700 14px/1 var(--ml);letter-spacing:0;text-transform:none}
  .btn.solid{background:var(--maroon);color:#fff}
  .btn:hover{background:var(--maroon);color:#fff}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible,.lang button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}

  .divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:26px auto}
  .divider i{height:1px;width:56px;background:var(--line)}
  .divider svg{width:9px;height:9px;fill:var(--gold)}

  /* ================= COVER ================= */
  .cover{
    position:fixed;inset:0;z-index:50;
    display:flex;
    padding:max(64px, env(safe-area-inset-top)) var(--gutter) max(24px, env(safe-area-inset-bottom));
    background:
      radial-gradient(70% 45% at 50% 38%, #fffaf0 0%, transparent 70%),
      radial-gradient(120% 60% at 50% 110%, #f6dfc0 0%, transparent 70%),
      var(--ivory);
    overflow-y:auto;
    transition:opacity .9s ease, visibility 0s linear .9s;
  }
  .cover.gone{opacity:0;visibility:hidden;pointer-events:none}
  .cover-card{
    position:relative;width:min(400px, 100%);margin:auto;
    padding:clamp(34px, 7vh, 52px) clamp(20px, 6vw, 36px) clamp(26px, 5vh, 36px);
    text-align:center;
    border:1px solid var(--line);
    border-radius:220px 220px 22px 22px;
    background:rgba(255,253,248,.7);
    box-shadow:0 30px 70px -36px rgba(142,27,44,.35);
    transition:transform .8s cubic-bezier(.2,.7,.2,1), opacity .6s ease;
  }
  .cover-card::before{
    content:"";position:absolute;inset:8px;pointer-events:none;
    border:1px solid var(--line);border-radius:212px 212px 16px 16px;
  }
  .cover.opening .cover-card{transform:translateY(-14px) scale(.97);opacity:0}
  .cover .kicker{margin-bottom:6px}
  .rk-frame{
    width:min(340px, 88vw);aspect-ratio:880/957;max-height:46svh;margin:0 auto -6px;
    overflow:hidden;
    -webkit-mask-image:radial-gradient(ellipse closest-side at 50% 50%, #000 66%, transparent 100%);
            mask-image:radial-gradient(ellipse closest-side at 50% 50%, #000 66%, transparent 100%);
  }
  .rk-frame .rk{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 50%;mix-blend-mode:multiply}
  .cover .names{font-size:clamp(40px, 11vw, 56px)}
  body.ml .cover .names{font-size:clamp(30px, 8.5vw, 40px)}
  .cover .date-line{margin-top:10px}
  .open-btn{margin-top:clamp(18px, 3.5vh, 28px);padding:14px 28px;position:relative;overflow:hidden;box-shadow:0 10px 26px -12px rgba(142,27,44,.6)}
  .open-btn::after{
    content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
    animation:shine 3.2s ease-in-out infinite 1s;
  }
  @keyframes shine{0%{left:-60%}45%,100%{left:130%}}
  .cover-fade{transition:opacity .25s ease}
  .cover-fade.out{opacity:0}

  /* little Krishna & Radha */
  .rk{animation:breathe 14s ease-in-out infinite alternate;transform-origin:50% 55%}
  @keyframes breathe{from{transform:scale(1)}to{transform:scale(1.05)}}

  /* petals */
  .petals{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
  .petal{
    position:absolute;top:-24px;width:12px;height:14px;
    border-radius:0 100% 0 100%;opacity:.85;
    animation:fall linear forwards;
  }
  @keyframes fall{
    0%{transform:translate3d(0,0,0) rotate(0)}
    100%{transform:translate3d(var(--dx), 110vh, 0) rotate(var(--r))}
  }

  /* ================= PAGE ================= */
  .wrap{
    width:min(100%, 520px);margin:0 auto;
    padding:0 var(--gutter) max(40px, env(safe-area-inset-bottom));
    opacity:0;transform:translateY(18px);
    transition:opacity 1.1s ease .15s, transform 1.1s cubic-bezier(.2,.7,.2,1) .15s;
  }
  body.opened .wrap{opacity:1;transform:none}
  .wrap.lang-out{opacity:0 !important;transition:opacity .22s ease}
  section{padding:clamp(48px, 9vw, 72px) 0;text-align:center;position:relative}
  section + section::before{
    content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:min(240px, 60%);height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);
  }
  .inner{max-width:560px;margin:0 auto}

  /* hero */
  .hero{
    padding-top:clamp(84px, 16vw, 110px);min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  }
  .hero-top .title{
    font-family:var(--script);font-weight:400;color:var(--maroon);
    font-size:clamp(32px, 9vw, 46px);line-height:1.1;margin:12px 0 4px;
  }
  body.ml .hero-top .title{font-family:var(--ml-script);font-size:clamp(28px, 8vw, 40px);line-height:1.35}
  .heart{display:block;margin:2px auto 22px;width:13px;height:13px}
  .arch{
    position:relative;width:min(290px, 74vw);aspect-ratio:3/4;margin:0 auto;
    padding:8px;border-radius:999px 999px 18px 18px;
    border:1px solid var(--gold-soft);background:var(--paper);
    box-shadow:0 24px 50px -24px rgba(142,27,44,.3);
  }
  .arch img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;border-radius:999px 999px 12px 12px;display:block}
  .arch::after{content:"";position:absolute;inset:-9px;border-radius:999px 999px 24px 24px;border:1px solid var(--line);pointer-events:none}
  .hero-bottom{margin-top:28px}
  .hero-bottom .date-line{margin-top:12px}
  .scroll-cue{margin:34px auto 0;width:1px;height:42px;background:linear-gradient(var(--gold),transparent);animation:cue 2.4s ease-in-out infinite}
  @keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

  /* invitation text */
  .om{width:34px;height:34px;margin:0 auto 18px;display:block}
  .lead{font-size:clamp(17px, 4.4vw, 19px);line-height:1.75;color:var(--muted);max-width:440px;margin:0 auto}
  body.ml .lead{font-size:clamp(15px, 4vw, 17px);line-height:1.95}
  .person{font-family:var(--script);font-weight:400;color:var(--maroon);font-size:clamp(36px, 10vw, 50px);line-height:1.2;margin:18px 0 6px}
  body.ml .person{font-family:var(--ml);font-weight:700;font-size:clamp(26px, 7vw, 32px);margin:16px 0 4px}
  .family{font-size:17px;line-height:1.6;color:var(--ink)}
  body.ml .family{font-size:15.5px;line-height:1.8}
  .family:empty{display:none}
  .family strong{font-weight:600}
  body.ml .family strong{font-weight:700}
  .with{font-style:italic;color:var(--gold);font-size:18px;margin:6px 0}
  body.ml .with{display:none}

  /* details */
  .h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(24px, 6vw, 30px);color:var(--maroon)}
  body.ml .h2{font-family:var(--ml);font-style:normal;font-weight:700;font-size:clamp(19px, 5vw, 23px)}
  .details{display:grid;grid-template-columns:1fr;gap:12px;margin:22px auto 0;max-width:460px}
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:20px 18px;display:flex;align-items:center;gap:16px;text-align:left;
  }
  .card svg{flex:none;width:28px;height:28px;stroke:var(--maroon);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
  .card .lbl{font:500 10.5px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
  body.ml .card .lbl{font:700 13px/1.3 var(--ml);letter-spacing:0;text-transform:none}
  .card .val{font-size:19px;line-height:1.35;color:var(--ink)}
  body.ml .card .val{font-size:16px;line-height:1.6}
  .card .sub{font-size:14.5px;color:var(--muted);margin-top:2px}
  body.ml .card .sub{font-size:13.5px}
  .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}

  /* countdown */
  .count{display:grid;grid-template-columns:repeat(4, minmax(0, 84px));justify-content:center;gap:clamp(6px, 2.4vw, 12px);margin-top:22px}
  .count div{padding:14px 0 12px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
  .count b{display:block;font:500 clamp(22px, 7vw, 30px)/1 var(--serif);color:var(--maroon);font-variant-numeric:tabular-nums}
  .count span{display:block;margin-top:8px;font:400 9px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  body.ml .count span{font:400 11px/1.2 var(--ml);letter-spacing:0;text-transform:none}

  /* hosts */
  .hosts .by{font-style:italic;color:var(--gold);font-size:18px}
  body.ml .hosts .by{font-style:normal;font-size:16px}
  .hosts .who{font-size:clamp(20px, 5.5vw, 24px);font-weight:600;color:var(--maroon);margin:8px 0 4px}
  body.ml .hosts .who{font-size:18px;font-weight:700}
  .hosts .where{color:var(--muted);font-size:16px}
  body.ml .hosts .where{font-size:15px}
  .phone{display:inline-block;margin-top:10px;font:400 15px/1 var(--sans);letter-spacing:.14em;color:var(--ink);text-decoration:none}
  .lotus-foot{display:block;margin:40px auto 0;width:140px}
  .foot{font:400 10px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-soft);margin-top:18px}

  /* reveal */
  .rv{opacity:0;transform:translateY(16px);transition:opacity .9s ease,transform .9s ease}
  .rv.in{opacity:1;transform:none}

  /* ---------- very small phones ---------- */
  @media (max-width:350px){
    .card{padding:16px 14px;gap:12px}
    .card .val{font-size:17px}
    .count span{letter-spacing:.1em}
    .date-line{letter-spacing:.18em;font-size:11.5px}
  }
  /* ---------- short landscape phones ---------- */
  @media (max-height:520px) and (orientation:landscape){
    .cover{padding-top:16px;padding-bottom:16px}
    .cover-card{border-radius:24px;padding:18px 24px;width:min(520px, 100%)}
    .cover-card::before{border-radius:18px}
    .rk-frame{height:36svh;width:auto;max-height:none}
    .cover .names{font-size:38px}
    .cover .date-line{margin-top:4px}
    .open-btn{margin-top:12px}
  }

  /* ---------- tablet ---------- */
  @media (min-width:700px){
    .wrap{width:min(100% - 48px, 760px);margin:48px auto;padding-bottom:40px;
      background:rgba(255,253,248,.6);border:1px solid var(--line);border-radius:32px;
      box-shadow:0 30px 80px -44px rgba(142,27,44,.3)}
    .hero{min-height:auto}
    .details{grid-template-columns:repeat(3, 1fr);max-width:none;gap:14px}
    .card{flex-direction:column;text-align:center;gap:12px;padding:26px 16px}
  }

  /* ---------- desktop ---------- */
  @media (min-width:1000px){
    .wrap{width:min(100% - 80px, 1040px);padding:0 64px 48px}
    .hero{
      display:grid;grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas:"arch top" "arch bottom";
      column-gap:64px;align-items:center;text-align:left;padding:96px 0 80px;
    }
    .hero .arch{grid-area:arch;width:min(340px, 100%);justify-self:end}
    .hero-top{grid-area:top;align-self:end}
    .hero-bottom{grid-area:bottom;align-self:start;margin-top:22px}
    .hero .heart{margin:6px 0 0}
    .hero .names{justify-content:flex-start}
    .scroll-cue{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition-duration:.01ms !important}
    .rv{opacity:1;transform:none}
  }
</style>
</head>
<body class="locked">

<div class="lang" role="group" aria-label="Language">
  <button type="button" data-set="en" aria-pressed="true">EN</button>
  <button type="button" data-set="ml" aria-pressed="false">മല</button>
</div>

<!-- ================= COVER ================= -->
<div class="cover" id="cover">
  <div class="cover-card">
    <div class="cover-fade" id="coverFade">
      <p class="kicker" data-i18n="coverKicker"></p>

      <div class="rk-frame"><img class="rk" src="radha-krishna.webp" width="880" height="957" data-i18n-alt="rkAlt" alt="Little Krishna and Radha among lotus flowers"></div>

      <h1 class="names"><span data-i18n="groom"></span><span class="amp">&amp;</span><span data-i18n="bride"></span></h1>
      <p class="date-line" data-i18n="dateLine"></p>
      <button type="button" class="btn solid open-btn" id="openBtn">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5.5l6 4 6-4M2.5 4h11a.5.5 0 01.5.5v7a.5.5 0 01-.5.5h-11a.5.5 0 01-.5-.5v-7a.5.5 0 01.5-.5z"/></svg>
        <span data-i18n="openBtn"></span>
      </button>
    </div>
  </div>
</div>

<div class="petals" id="petals" aria-hidden="true"></div>

<main class="wrap" id="page" aria-hidden="true">

  <!-- ================= HERO ================= -->
  <section class="hero">
    <div class="hero-top">
      <p class="kicker" data-i18n="kicker"></p>
      <h2 class="title" data-i18n="title"></h2>
      <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="#8e1b2c" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.1 1.7-1.9 3.1-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
    </div>

    <div class="arch">
      <img src="couple.webp" width="900" height="1200" alt="Illustrated portrait of Manu and Anisha at a temple" data-i18n-alt="alt">
    </div>

    <div class="hero-bottom">
      <p class="names" tabindex="-1" id="heroNames">
        <span data-i18n="groom"></span><span class="amp">&amp;</span><span data-i18n="bride"></span>
      </p>
      <p class="date-line" data-i18n="dateLine"></p>
    </div>
    <div class="scroll-cue" aria-hidden="true"></div>
  </section>

  <!-- ================= INVITATION ================= -->
  <section class="rv">
    <div class="inner">
      <svg class="om" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#b8893b" stroke-width="1.2" stroke-linecap="round">
        <path d="M24 10c-5 6-5 16 0 24 5-8 5-18 0-24z"/>
        <path d="M24 34c-6-2-12-8-13-16 7 1 11 6 13 12"/>
        <path d="M24 34c6-2 12-8 13-16-7 1-11 6-13 12"/>
        <path d="M8 36c6 2 12 2 16-2 4 4 10 4 16 2"/>
      </svg>
      <p class="lead" data-i18n="intro"></p>
      <h3 class="person" data-i18n="groomFull"></h3>
      <p class="with" data-i18n="with"></p>
      <p class="family" data-i18n-html="brideFamily"></p>
      <h3 class="person" data-i18n="brideFull"></h3>
      <p class="family" data-i18n-html="brideFamilyAfter"></p>
      <div class="divider" aria-hidden="true"><i></i><svg viewBox="0 0 10 10"><path d="M5 0l5 5-5 5-5-5z"/></svg><i></i></div>
      <p class="lead" data-i18n="closing"></p>
    </div>
  </section>

  <!-- ================= DETAILS ================= -->
  <section class="rv">
    <h3 class="h2" data-i18n="detailsHead"></h3>
    <div class="details">
      <div class="card">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="24" height="22" rx="3"/><path d="M4 12h24M10 3v6M22 3v6"/><path d="M12 20h8"/></svg>
        <div><p class="lbl" data-i18n="dateLbl"></p><p class="val" data-i18n="dateVal"></p><p class="sub" data-i18n="dateSub"></p></div>
      </div>
      <div class="card">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="17" r="11"/><path d="M16 10v7l5 3"/></svg>
        <div><p class="lbl" data-i18n="timeLbl"></p><p class="val" data-i18n="timeVal"></p><p class="sub" data-i18n="timeSub"></p></div>
      </div>
      <div class="card">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 29s-9-9.2-9-16a9 9 0 0118 0c0 6.8-9 16-9 16z"/><circle cx="16" cy="13" r="3.2"/></svg>
        <div><p class="lbl" data-i18n="venueLbl"></p><p class="val" data-i18n="venueVal"></p><p class="sub" data-i18n="venueSub"></p></div>
      </div>
    </div>
    <div class="actions">
      <a class="btn solid" id="mapLink" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16"><path d="M8 15s-5-5-5-8.6a5 5 0 0110 0C13 10 8 15 8 15z"/></svg>
        <span data-i18n="mapBtn"></span>
      </a>
      <a class="btn" id="calLink" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M8 8.5v4M6 10.5h4"/></svg>
        <span data-i18n="calBtn"></span>

    rkAlt:"താമരപ്പൂക്കൾക്കിടയിൽ ഉണ്ണിക്കണ്ണനും രാധയും",

    alt:"ക്ഷേത്രമുറ്റത്ത് മനുവും അനിഷയും",
    groom:"മനു", bride:"അനിഷ",
    dateLine:"2026 ഡിസംബർ 06 · ഞായറാഴ്ച",
    intro:"കൊല്ലവർഷം 1202 വൃശ്ചികമാസം 20-ാം തിയ്യതി (6/12/2026) ഞായറാഴ്ച കാലത്ത് 10.30 നും 11.30 നും മദ്ധ്യേയുള്ള ശുഭമുഹൂർത്തത്തിൽ ഞങ്ങളുടെ മകൻ",

    detailsHead:"വിവാഹം",
    dateLbl:"തീയതി", dateVal:"2026 ഡിസംബർ 06, ഞായറാഴ്ച", dateSub:"കൊല്ലവർഷം 1202 വൃശ്ചികം 20",
    timeLbl:"മുഹൂർത്തം", timeVal:"രാവിലെ 10.30 – 11.30", timeSub:"ശുഭമുഹൂർത്തം",
    venueLbl:"വേദി", venueVal:"കൃഷ്ണശ്രീ കല്യാണമണ്ഡപം", venueSub:"പാറ",
    mapBtn:"വഴി കാണുക", calBtn:"കലണ്ടറിൽ ചേർക്കുക", callBtn:"വിളിക്കുക",
    countHead:"ശുഭമുഹൂർത്തത്തിലേക്ക് ഇനി",
    countDone:"അനുഗ്രഹങ്ങൾക്ക് നന്ദി",
    d:"ദിവസം", h:"മണിക്കൂർ", m:"മിനിറ്റ്", s:"സെക്കൻഡ്",
    by:"എന്ന്,",
    hosts:"ശ്രീ. മാണിക്യൻ & ശ്രീമതി. ദേവകി",
    hostsPlace:"എലിയപാടം, തെക്കേക്കര, വേങ്ങോടി"
  }
};

const page = document.getElementById("page");
const cover = document.getElementById("cover");
const coverFade = document.getElementById("coverFade");
const mapLink = document.getElementById("mapLink");
const calLink = document.getElementById("calLink");
let lang = "en";
let opened = false;

function apply(l, animate){
  lang = l;
  const run = () => {
    const t = T[l];
    document.documentElement.lang = l === "ml" ? "ml" : "en";
    document.body.classList.toggle("ml", l === "ml");
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n] ?? ""; });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t[el.dataset.i18nHtml] ?? ""; });
    document.querySelectorAll("[data-i18n-alt]").forEach(el => { el.alt = t[el.dataset.i18nAlt]; });
    document.querySelectorAll("[data-i18n-label]").forEach(el => { el.setAttribute("aria-label", t[el.dataset.i18nLabel]); });
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.set === l));
    document.title = l === "ml" ? "മനു ❤ അനിഷ · വിവാഹ ക്ഷണം" : "Manu & Anisha · Wedding Invitation";
    calLink.href = calendarUrl(t);
    tick();
    page.classList.remove("lang-out");
    coverFade.classList.remove("out");
  };
  if (animate){
    (opened ? page : coverFade).classList.add(opened ? "lang-out" : "out");
    setTimeout(run, 220);
  } else run();
  try { localStorage.setItem("invite-lang", l); } catch(e){}
  if (location.hash !== "#" + l) history.replaceState(null, "", "#" + l);
}

document.querySelectorAll(".lang button").forEach(b =>
  b.addEventListener("click", () => { if (b.dataset.set !== lang) apply(b.dataset.set, true); })
);

/* ---- open the invitation ---- */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function openInvite(){
  if (opened) return;
  opened = true;
  cover.classList.add("opening");
  setTimeout(() => {
    cover.classList.add("gone");
    document.body.classList.remove("locked");
    document.body.classList.add("opened");
    page.removeAttribute("aria-hidden");
    window.scrollTo(0, 0);
    document.getElementById("heroNames").focus({preventScroll:true});
    if (!reduceMotion) petals();
  }, reduceMotion ? 0 : 550);
}
document.getElementById("openBtn").addEventListener("click", openInvite);

function petals(){
  const box = document.getElementById("petals");
  const colors = ["#e48aa8", "#f4a6b8", "#f2c14e", "#d9bd84", "#f7c6d2"];
  const n = window.innerWidth < 600 ? 22 : 36;
  for (let i = 0; i < n; i++){
    const p = document.createElement("span");
    p.className = "petal";
    const size = 8 + Math.random() * 8;
    p.style.cssText =
      `left:${Math.random() * 100}%;width:${size}px;height:${size * 1.2}px;` +
      `background:${colors[i % colors.length]};` +
      `animation-duration:${4.5 + Math.random() * 3.5}s;animation-delay:${Math.random() * 1.8}s;` +
      `--dx:${(Math.random() * 160 - 80).toFixed(0)}px;--r:${(Math.random() * 720 - 360).toFixed(0)}deg`;
    box.appendChild(p);
  }
  setTimeout(() => { box.innerHTML = ""; }, 11000);
}

/* ---- map + calendar ---- */
mapLink.href = MAP_URL;
function calendarUrl(t){
  const p = new URLSearchParams({
    action:"TEMPLATE",
    text: lang === "ml" ? "മനു ❤ അനിഷ — വിവാഹം" : "Wedding of Manu & Anisha",
    dates:"20261206T050000Z/20261206T060000Z",
    details: t.intro + " " + t.groomFull + " / " + t.brideFull,
    location:"Krishnasree Kalyana Mandapam, Para"
  });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

/* ---- countdown ---- */
const pad = n => String(n).padStart(2, "0");
function tick(){
  const diff = WEDDING - new Date();
  const head = document.getElementById("countHead");
  if (diff <= 0){
    document.getElementById("count").style.display = "none";
    head.textContent = T[lang].countDone;
    return;
  }
  const s = Math.floor(diff / 1000);
  document.getElementById("cd-d").textContent = Math.floor(s / 86400);
  document.getElementById("cd-h").textContent = pad(Math.floor(s % 86400 / 3600));
  document.getElementById("cd-m").textContent = pad(Math.floor(s % 3600 / 60));
  document.getElementById("cd-s").textContent = pad(s % 60);
}
setInterval(tick, 1000);

/* ---- reveal on scroll ---- */
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
}, {threshold:.12}) : null;
document.querySelectorAll(".rv").forEach(el => io ? io.observe(el) : el.classList.add("in"));

/* ---- initial language: #ml / #en link, then saved choice, then English ---- */
function fromHash(){ const h = location.hash.slice(1); return T[h] ? h : null; }
let saved = null; try { saved = localStorage.getItem("invite-lang"); } catch(e){}
apply(fromHash() || (T[saved] ? saved : "en"), false);
window.addEventListener("hashchange", () => { const h = fromHash(); if (h && h !== lang) apply(h, true); });
</script>
