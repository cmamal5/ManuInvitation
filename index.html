<head>

<style>
  :root{
    --ivory:#fbf6ec;
    --paper:#fffdf8;
    --peach:#f6e3c6;
    --maroon:#8e1b2c;
    --maroon-soft:#a8394a;
    --gold:#b8893b;
    --gold-soft:#d9bd84;
    --lotus:#e48aa8;
    --ink:#3b2a24;
    --muted:#7a6558;
    --line:rgba(184,137,59,.35);
    --serif:"Cormorant Garamond", Georgia, serif;
    --script:"Pinyon Script", "Cormorant Garamond", serif;
    --sans:"Jost", system-ui, sans-serif;
    --ml:"Manjari", "Noto Sans Malayalam", sans-serif;
    --ml-script:"Chilanka", "Manjari", sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--serif);
    color:var(--ink);
    background:
      radial-gradient(120% 60% at 50% 0%, #fff8ea 0%, transparent 60%),
      radial-gradient(90% 50% at 50% 100%, #f8e6cb 0%, transparent 70%),
      var(--ivory);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body.ml{font-family:var(--ml)}

  /* ---------- language toggle ---------- */
  .lang{
    position:fixed;top:14px;right:14px;z-index:20;
    display:flex;padding:3px;border-radius:999px;
    background:rgba(255,253,248,.85);backdrop-filter:blur(8px);
    border:1px solid var(--line);box-shadow:0 4px 18px rgba(142,27,44,.08);
  }
  .lang button{
    border:0;background:transparent;cursor:pointer;
    padding:7px 14px;border-radius:999px;
    font:500 13px/1 var(--sans);letter-spacing:.06em;color:var(--muted);
    transition:background .25s,color .25s;
  }
  .lang button[data-set="ml"]{font-family:var(--ml);font-weight:700;letter-spacing:0;font-size:14px}
  .lang button[aria-pressed="true"]{background:var(--maroon);color:#fff}

  /* ---------- layout ---------- */
  .wrap{max-width:460px;margin:0 auto;padding:0 22px 40px;position:relative}
  section{padding:56px 0;text-align:center;position:relative}
  section + section{border-top:1px solid var(--line)}

  /* ---------- hero ---------- */
  .hero{padding-top:120px;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .bells{position:absolute;top:0;left:0;right:0;height:120px;pointer-events:none}
  .bells svg{position:absolute;top:0}
  .bells .l{left:6px}.bells .r{right:6px}
  .bell-swing{transform-origin:50% 0;animation:swing 4s ease-in-out infinite}
  .bells .r .bell-swing{animation-delay:-2s}
  @keyframes swing{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}

  .kicker{
    font:400 11px/1.6 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);
  }
  body.ml .kicker{font:700 14px/1.4 var(--ml);letter-spacing:.04em;text-transform:none}
  .title{
    font-family:var(--script);font-weight:400;color:var(--maroon);
    font-size:44px;line-height:1.1;margin:14px 0 6px;
  }
  body.ml .title{font-family:var(--ml-script);font-size:40px;line-height:1.35}
  .heart{display:block;margin:4px auto 22px;width:14px;height:14px}

  .arch{
    position:relative;width:min(300px,78vw);aspect-ratio:3/4;margin:0 auto;
    padding:8px;border-radius:999px 999px 18px 18px;
    border:1px solid var(--gold-soft);
    background:var(--paper);
    box-shadow:0 20px 50px -20px rgba(142,27,44,.25);
  }
  .arch img{
    width:100%;height:100%;object-fit:cover;object-position:50% 18%;
    border-radius:999px 999px 12px 12px;display:block;
  }
  .arch::after{ /* inner hairline */
    content:"";position:absolute;inset:-9px;border-radius:999px 999px 24px 24px;
    border:1px solid var(--line);pointer-events:none;
  }

  .names{
    margin-top:30px;display:flex;align-items:center;justify-content:center;gap:14px;
    font-family:var(--script);color:var(--maroon);font-size:48px;line-height:1;
  }
  body.ml .names{font-family:var(--ml);font-weight:700;font-size:38px}
  .names .amp{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--gold)}
  .date-line{
    margin-top:14px;font:400 13px/1.6 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--muted);
  }
  body.ml .date-line{font:400 16px/1.6 var(--ml);letter-spacing:.02em;text-transform:none}
  .scroll-cue{margin-top:36px;width:1px;height:42px;background:linear-gradient(var(--gold),transparent);animation:cue 2.4s ease-in-out infinite}
  @keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

  /* ---------- invitation text ---------- */
  .om{width:34px;height:34px;margin:0 auto 18px;display:block}
  .lead{font-size:18px;line-height:1.7;color:var(--muted);max-width:360px;margin:0 auto}
  body.ml .lead{font-size:16px;line-height:1.9}
  .person{
    font-family:var(--script);color:var(--maroon);font-size:42px;line-height:1.2;margin:18px 0 6px;
  }
  body.ml .person{font-family:var(--ml);font-weight:700;font-size:30px;margin:16px 0 4px}
  .family{font-size:17px;line-height:1.6;color:var(--ink)}
  body.ml .family{font-size:15.5px;line-height:1.8}
  .family:empty{display:none}
  .family strong{font-weight:600}
  body.ml .family strong{font-weight:700}
  .with{font-style:italic;color:var(--gold);font-size:18px;margin:8px 0}
  body.ml .with{display:none}

  /* ---------- details ---------- */
  .details{display:grid;grid-template-columns:1fr;gap:14px;margin-top:6px}
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:22px 18px;display:flex;align-items:center;gap:16px;text-align:left;
  }
  .card svg{flex:none;width:30px;height:30px;stroke:var(--maroon);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
  .card .lbl{font:500 10.5px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
  body.ml .card .lbl{font:700 13px/1.3 var(--ml);letter-spacing:0;text-transform:none}
  .card .val{font-size:19px;line-height:1.35;color:var(--ink)}
  body.ml .card .val{font-size:16px;line-height:1.6}
  .card .sub{font-size:14.5px;color:var(--muted);margin-top:2px}
  body.ml .card .sub{font-size:13.5px}

  .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
  .btn{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;cursor:pointer;
    padding:12px 20px;border-radius:999px;border:1px solid var(--maroon);
    font:500 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;
    color:var(--maroon);background:transparent;transition:background .25s,color .25s;
  }
  body.ml .btn{font:700 14px/1 var(--ml);letter-spacing:0;text-transform:none}
  .btn.solid{background:var(--maroon);color:#fff}
  .btn:hover{background:var(--maroon);color:#fff}
  .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}

  /* ---------- countdown ---------- */
  .count{display:flex;justify-content:center;gap:10px;margin-top:22px}
  .count div{
    width:70px;padding:14px 0 12px;border-radius:14px;background:var(--paper);border:1px solid var(--line);
  }
  .count b{display:block;font:500 28px/1 var(--serif);color:var(--maroon);font-variant-numeric:tabular-nums}
  .count span{display:block;margin-top:8px;font:400 9.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  body.ml .count span{font:400 12px/1 var(--ml);letter-spacing:0;text-transform:none}
  .h2{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--maroon)}
  body.ml .h2{font-family:var(--ml);font-style:normal;font-weight:700;font-size:21px}

  /* ---------- hosts ---------- */
  .hosts .by{font-style:italic;color:var(--gold);font-size:18px}
  body.ml .hosts .by{font-style:normal;font-size:16px}
  .hosts .who{font-size:22px;font-weight:600;color:var(--maroon);margin:8px 0 4px}
  body.ml .hosts .who{font-size:18px;font-weight:700}
  .hosts .where{color:var(--muted);font-size:16px}
  body.ml .hosts .where{font-size:15px}
  .phone{display:inline-block;margin-top:10px;font:400 15px/1 var(--sans);letter-spacing:.14em;color:var(--ink);text-decoration:none}

  .lotus-foot{display:block;margin:40px auto 0;width:150px}
  .foot{font:400 10px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-soft);margin-top:18px}

  /* divider */
  .divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px auto}
  .divider i{height:1px;width:56px;background:var(--line)}
  .divider svg{width:10px;height:10px;fill:var(--gold)}

  /* reveal */
  .rv{opacity:0;transform:translateY(16px);transition:opacity .9s ease,transform .9s ease}
  .rv.in{opacity:1;transform:none}
  .fade{transition:opacity .25s ease}
  .fade.out{opacity:0}

  @media (min-width:700px){
    body{padding:40px 0}
    .wrap{background:rgba(255,253,248,.55);border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 80px -40px rgba(142,27,44,.25);overflow:hidden}
    .hero{min-height:auto;padding-top:110px}
  }
  @media (prefers-reduced-motion:reduce){
    .rv{opacity:1;transform:none;transition:none}
    .bell-swing,.scroll-cue{animation:none}
  }
</style>
</head>

    closing:"തമ്മിലുള്ള വിവാഹം പാറ കൃഷ്ണശ്രീ കല്യാണമണ്ഡപത്തിൽ വെച്ച് നടത്തുവാൻ നിശ്ചയിച്ചിരിക്കുന്നു. തദവസരത്തിൽ താങ്കളുടെ കുടുംബസമേതമുള്ള മഹനീയ സാന്നിദ്ധ്യം സാദരം ക്ഷണിച്ചുകൊള്ളുന്നു.",
    detailsHead:"വിവാഹം",
    dateLbl:"തീയതി", dateVal:"2026 ഡിസംബർ 06, ഞായറാഴ്ച", dateSub:"കൊല്ലവർഷം 1202 വൃശ്ചികം 20",
    timeLbl:"മുഹൂർത്തം", timeVal:"രാവിലെ 10.30 – 11.30", timeSub:"ശുഭമുഹൂർത്തം",
    venueLbl:"വേദി", venueVal:"കൃഷ്ണശ്രീ കല്യാണമണ്ഡപം", venueSub:"പാറ",
    mapBtn:"വഴി കാണുക", calBtn:"കലണ്ടറിൽ ചേർക്കുക", callBtn:"വിളിക്കുക",
    countHead:"ശുഭമുഹൂർത്തത്തിലേക്ക് ഇനി",
    countDone:"അനുഗ്രഹങ്ങൾക്ക് നന്ദി",
    d:"ദിവസം", h:"മണിക്കൂർ", m:"മിനിറ്റ്", s:"സെക്കൻഡ്",
    by:"എന്ന്,",
    hosts:"ശ്രീ. മാണിക്യൻ & ശ്രീമതി. ദേവകി",
    hostsPlace:"എലിയപാടം, തെക്കേക്കര, വേങ്ങോടി"
  }
};

const page = document.getElementById("page");
let lang = "en";

function apply(l, animate){
  lang = l;
  const run = () => {
    const t = T[l];
    document.documentElement.lang = l === "ml" ? "ml" : "en";
    document.body.classList.toggle("ml", l === "ml");
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n] ?? ""; });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t[el.dataset.i18nHtml] ?? ""; });
    document.querySelectorAll("[data-i18n-alt]").forEach(el => { el.alt = t[el.dataset.i18nAlt]; });
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.set === l));
    document.title = l === "ml" ? "മനു ❤ അനിഷ · വിവാഹ ക്ഷണം" : "Manu & Anisha · Wedding Invitation";
    calLink.href = calendarUrl(t);
    tick();
    page.classList.remove("out");
  };
  if (animate){ page.classList.add("out"); setTimeout(run, 220); } else run();
  try { localStorage.setItem("invite-lang", l); } catch(e){}
  if (location.hash !== "#" + l) history.replaceState(null, "", "#" + l);
}

document.querySelectorAll(".lang button").forEach(b =>
  b.addEventListener("click", () => { if (b.dataset.set !== lang) apply(b.dataset.set, true); })
);

/* map + calendar */
const mapLink = document.getElementById("mapLink");
const calLink = document.getElementById("calLink");
mapLink.href = MAP_URL;
function calendarUrl(t){
  const p = new URLSearchParams({
    action:"TEMPLATE",
    text: lang === "ml" ? "മനു ❤ അനിഷ — വിവാഹം" : "Wedding of Manu & Anisha",
    dates:"20261206T050000Z/20261206T060000Z",
    details: t.intro + " " + t.groomFull + " / " + t.brideFull,
    location:"Krishnasree Kalyana Mandapam, Para"
  });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

/* countdown */
const pad = n => String(n).padStart(2, "0");
function tick(){
  const diff = WEDDING - new Date();
  const head = document.getElementById("countHead");
  if (diff <= 0){
    document.getElementById("count").style.display = "none";
    head.textContent = T[lang].countDone;
    return;
  }
  const s = Math.floor(diff / 1000);
  document.getElementById("cd-d").textContent = Math.floor(s / 86400);
  document.getElementById("cd-h").textContent = pad(Math.floor(s % 86400 / 3600));
  document.getElementById("cd-m").textContent = pad(Math.floor(s % 3600 / 60));
  document.getElementById("cd-s").textContent = pad(s % 60);
}
setInterval(tick, 1000);

/* reveal on scroll */
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
}, {threshold:.15}) : null;
document.querySelectorAll(".rv").forEach(el => io ? io.observe(el) : el.classList.add("in"));

/* initial language: #ml / #en link, then saved choice, then English */
function fromHash(){ const h = location.hash.slice(1); return T[h] ? h : null; }
let saved = null; try { saved = localStorage.getItem("invite-lang"); } catch(e){}
apply(fromHash() || (T[saved] ? saved : "en"), false);
window.addEventListener("hashchange", () => { const h = fromHash(); if (h && h !== lang) apply(h, true); });
</script>
